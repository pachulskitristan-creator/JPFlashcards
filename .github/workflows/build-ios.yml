name: Build Unsigned iOS IPA

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: npm install
        
      - name: Expo Prebuild
        run: npx expo prebuild --platform ios
        
      - name: Install CocoaPods
        run: cd ios && pod install
        
      - name: Build Unsigned App
        run: |
          cd ios
          
          # 1. Write the exact Node.js location to the specific file Xcode requires
          echo "export NODE_BINARY=$(command -v node)" > .xcode.env.local
          
          # 2. Give the JavaScript bundler more memory
          export NODE_OPTIONS="--max-old-space-size=4096"
          
          # 3. Build the app with Sandboxing and Signing explicitly disabled
          xcodebuild -workspace JPFlashcards.xcworkspace \
            -scheme JPFlashcards \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""
            
      - name: Package into IPA
        run: |
          mkdir Payload
          mv ios/build/Build/Products/Release-iphoneos/JPFlashcards.app Payload/
          zip -r JPFlashcards.ipa Payload
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JPFlashcards-IPA
          path: JPFlashcards.ipa